# Production stack for peptideeinkaufen.de.
#
# Run from the server checkout: `docker compose -f deploy/docker-compose.yml ...`
# with an env file at /srv/peptides/.env (see deploy/.env.template). Prefer
# deploy/deploy.sh over driving this by hand — AGENTS.md requires one scripted
# deploy path.
#
# Only Caddy publishes ports. Postgres, Redis and Medusa are reachable on the
# internal compose network and nowhere else.

name: peptides

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly so queued events survive a restart — the whole reason Redis is
    # here rather than Medusa's in-memory default.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  medusa:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: peptides-medusa:${DEPLOY_SHA:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      MEDUSA_BACKEND_URL: https://api.${SITE_DOMAIN}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - medusa
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      GATE_USER: ${GATE_USER}
      GATE_PASSWORD_HASH: ${GATE_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Built storefront, written by deploy.sh. Read-only to Caddy.
      - /srv/peptides/storefront:/srv/storefront:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
